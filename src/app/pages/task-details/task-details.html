<section class="task-details">
  @if (task) {
    <p class="task-status">{{ task.status }}</p>

    <h2>{{ task.title }}</h2>

    <p>{{ task.description }}</p>

    <div class="task-meta">
      <span>Due date</span>
      <strong>{{ task.dueDate }}</strong>
    </div>
  } @else {
    <h2>Task not found</h2>
    <p>The requested task could not be found.</p>
  }
</section>
